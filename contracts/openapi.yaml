openapi: 3.1.0
info:
  title: KnowBound-CJ API
  version: 0.2.0
  description: Contract-first API for the KnowBound-CJ learning assistant.
servers:
- url: http://localhost:8000
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/login:
    post:
      operationId: login
      summary: Authenticate a seeded MVP account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed bearer token and server-verified actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credentials are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /courses:
    get:
      operationId: listCourses
      summary: List courses visible to the authenticated actor.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Enrolled courses for a student, or owned/authorized courses for a teacher.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseSummary'
        '401':
          description: Bearer token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /courses/{course_id}/exercises:
    get:
      operationId: listCourseExercises
      summary: List exercises after server-side course membership checks.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Exercises in the authorized course.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseSummary'
        '401':
          description: Bearer token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Returns RESOURCE_NOT_AVAILABLE for both unknown and unauthorized course IDs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /teacher/courses:
    post:
      operationId: createTeacherCourse
      summary: Create a course owned by the authenticated teacher.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
      responses:
        '201':
          description: Course created with ownership derived from the bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseSummary'
        '401':
          description: Bearer token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Student actors receive RESOURCE_NOT_AVAILABLE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /courses/{course_id}/enrollments:
    post:
      operationId: enrollCurrentStudent
      summary: Enroll the authenticated student; no user ID is accepted from the client.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CourseId'
      responses:
        '201':
          description: Current student enrolled in the course.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '401':
          description: Bearer token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Returns RESOURCE_NOT_AVAILABLE for an unknown course or a disallowed actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /teacher/courses/{course_id}/concepts:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    get:
      operationId: listCourseConcepts
      security:
      - bearerAuth: []
      responses:
        '200':
          description: All concepts of the course, any review status.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Concept'
        '404':
          $ref: '#/components/responses/NotAvailable'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
    post:
      operationId: createCourseConcept
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConceptCreate'
      responses:
        '201':
          description: Created with review_status=pending_review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Concept'
        '404':
          $ref: '#/components/responses/NotAvailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
  /teacher/courses/{course_id}/concepts/{concept_id}:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    - $ref: '#/components/parameters/ConceptId'
    patch:
      operationId: updateCourseConcept
      description: Any content change resets review_status to pending_review.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConceptUpdate'
      responses:
        '200':
          description: Updated concept.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Concept'
        '404':
          $ref: '#/components/responses/NotAvailable'
        '422':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
  /teacher/courses/{course_id}/concepts/{concept_id}/review:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    - $ref: '#/components/parameters/ConceptId'
    post:
      operationId: reviewCourseConcept
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecision'
      responses:
        '200':
          description: Reviewed concept.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Concept'
        '404':
          $ref: '#/components/responses/NotAvailable'
        '422':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
  /teacher/courses/{course_id}/concept-edges:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    get:
      operationId: listCourseConceptEdges
      security:
      - bearerAuth: []
      responses:
        '200':
          description: All edges of the course graph.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConceptEdge'
        '404':
          $ref: '#/components/responses/NotAvailable'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
    post:
      operationId: createCourseConceptEdge
      description: 'Rejects missing endpoints, wrong endpoint kinds and any prerequisite cycle. Only prerequisite edges must
        be acyclic; other edge types may be bidirectional.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConceptEdge'
      responses:
        '201':
          description: Created edge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConceptEdge'
        '404':
          $ref: '#/components/responses/NotAvailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
  /teacher/courses/{course_id}/misconceptions:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    get:
      operationId: listCourseMisconceptions
      security:
      - bearerAuth: []
      responses:
        '200':
          description: All misconception patterns of the course, any review status.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MisconceptionPattern'
        '404':
          $ref: '#/components/responses/NotAvailable'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
    post:
      operationId: createCourseMisconception
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MisconceptionCreate'
      responses:
        '201':
          description: Created with review_status=pending_review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MisconceptionPattern'
        '404':
          $ref: '#/components/responses/NotAvailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
  /teacher/courses/{course_id}/misconceptions/{misconception_id}:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    - $ref: '#/components/parameters/MisconceptionId'
    patch:
      operationId: updateCourseMisconception
      description: Any content change resets review_status to pending_review.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MisconceptionUpdate'
      responses:
        '200':
          description: Updated misconception.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MisconceptionPattern'
        '404':
          $ref: '#/components/responses/NotAvailable'
        '422':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
  /teacher/courses/{course_id}/misconceptions/{misconception_id}/review:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    - $ref: '#/components/parameters/MisconceptionId'
    post:
      operationId: reviewCourseMisconception
      description: Approval requires the root concept to be approved (409 ROOT_CONCEPT_NOT_APPROVED).
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecision'
      responses:
        '200':
          description: Reviewed misconception.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MisconceptionPattern'
        '404':
          $ref: '#/components/responses/NotAvailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
  /exercises/{exercise_id}/submissions:
    post:
      operationId: createExerciseSubmission
      summary: Persist and execute a submission for a published exercise.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ExerciseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreateRequest'
      responses:
        '201':
          description: Submission persisted before Runner invocation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '404':
          $ref: '#/components/responses/NotAvailable'
        '409':
          $ref: '#/components/responses/SubmissionConflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /submissions/{submission_id}:
    get:
      operationId: getSubmission
      summary: Read an authorized submission and its durable status.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Authorized submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '404':
          $ref: '#/components/responses/NotAvailable'
        '409':
          $ref: '#/components/responses/SubmissionConflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /submissions/{submission_id}/execution-result:
    get:
      operationId: getSubmissionExecutionResult
      summary: Read a persisted real Runner result and approved rule matches.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Persisted Runner v2 execution result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '404':
          $ref: '#/components/responses/NotAvailable'
        '409':
          $ref: '#/components/responses/SubmissionConflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /submissions/{submission_id}/diagnosis:
    get:
      operationId: getSubmissionDiagnosis
      summary: Read an existing evidence-bound diagnosis without invoking a model.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Existing validated diagnosis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnosis'
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/DiagnosticConflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/DiagnosticUnavailable'}
  /diagnoses/{diagnosis_id}/hints/next:
    post:
      operationId: createNextDiagnosisHint
      summary: Create the next server-selected hint level.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DiagnosisId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NextHintRequest'
      responses:
        '200':
          description: Persisted next hint; provider failure may return a safe fallback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HintEvent'
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/DiagnosticConflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/DiagnosticUnavailable'}
  /diagnoses/{diagnosis_id}/explanation-check:
    post:
      operationId: checkDiagnosisExplanation
      summary: Check a student's explanation against approved diagnosis evidence.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DiagnosisId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplanationCheckRequest'
      responses:
        '200':
          description: Persisted check; provider failure is safely recorded as ineligible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplanationCheck'
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/DiagnosticConflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/DiagnosticUnavailable'}
  /me/memory-proposals:
    get:
      operationId: listMyMemoryProposals
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CourseIdQuery'}]
      responses:
        '200': {description: Current student's course-scoped proposals., content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MemoryProposal'}}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/PersistenceUnavailable'}
  /memory-proposals/{proposal_id}/accept:
    post:
      operationId: acceptMemoryProposal
      security: [{bearerAuth: []}]
      parameters:
      - $ref: '#/components/parameters/ProposalId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {description: The one active memory created by student acceptance., content: {application/json: {schema: {$ref: '#/components/schemas/LearningMemory'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/PersistenceUnavailable'}
  /memory-proposals/{proposal_id}/reject:
    post:
      operationId: rejectMemoryProposal
      security: [{bearerAuth: []}]
      parameters:
      - $ref: '#/components/parameters/ProposalId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {description: Rejected proposal., content: {application/json: {schema: {$ref: '#/components/schemas/MemoryProposal'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/PersistenceUnavailable'}
  /memory-proposals/{proposal_id}:
    patch:
      operationId: correctMemoryProposal
      security: [{bearerAuth: []}]
      parameters:
      - $ref: '#/components/parameters/ProposalId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProposalCorrectionRequest'}}}}
      responses:
        '200': {description: New immutable proposal version., content: {application/json: {schema: {$ref: '#/components/schemas/MemoryProposal'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/PersistenceUnavailable'}
  /me/memories:
    get:
      operationId: listMyLearningMemories
      security: [{bearerAuth: []}]
      parameters:
      - $ref: '#/components/parameters/CourseIdQuery'
      - {name: query, in: query, required: false, schema: {type: [string, 'null']}}
      - {name: purpose, in: query, required: false, schema: {type: string, default: learning_support}}
      responses:
        '200': {description: Authorized active memories for the current student and course., content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/LearningMemory'}}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/PersistenceUnavailable'}
  /memories/{memory_id}:
    patch:
      operationId: correctLearningMemory
      security: [{bearerAuth: []}]
      parameters:
      - $ref: '#/components/parameters/MemoryId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryCorrectionRequest'}}}}
      responses:
        '200': {description: New active immutable memory version., content: {application/json: {schema: {$ref: '#/components/schemas/LearningMemory'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/PersistenceUnavailable'}
    delete:
      operationId: deleteLearningMemory
      security: [{bearerAuth: []}]
      parameters:
      - $ref: '#/components/parameters/MemoryId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': {description: Deletion receipt; pending is already non-retrievable., content: {application/json: {schema: {$ref: '#/components/schemas/DeletionReceipt'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/PersistenceUnavailable'}
  /memory-deletions/{deletion_id}:
    get:
      operationId: getMemoryDeletion
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeletionId'}]
      responses:
        '200': {description: Owner-visible deletion status without private text., content: {application/json: {schema: {$ref: '#/components/schemas/DeletionReceipt'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/PersistenceUnavailable'}
  /memory-deletions/{deletion_id}/retry:
    post:
      operationId: retryMemoryDeletion
      security: [{bearerAuth: []}]
      parameters:
      - $ref: '#/components/parameters/DeletionId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {description: Idempotent compensation result., content: {application/json: {schema: {$ref: '#/components/schemas/DeletionReceipt'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/PersistenceUnavailable'}
  /diagnoses/{diagnosis_id}/share-grants:
    post:
      operationId: createDiagnosisShareGrant
      security: [{bearerAuth: []}]
      parameters:
      - $ref: '#/components/parameters/DiagnosisId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ShareGrantCreateRequest'}}}}
      responses:
        '201': {description: Exact diagnosis-summary grant., content: {application/json: {schema: {$ref: '#/components/schemas/ShareGrant'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/PersistenceUnavailable'}
  /me/share-grants:
    get:
      operationId: listMyShareGrants
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CourseIdQuery'}]
      responses:
        '200': {description: Current student's exact grants., content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ShareGrant'}}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/PersistenceUnavailable'}
  /share-grants/{grant_id}:
    get:
      operationId: getShareGrant
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/GrantId'}]
      responses:
        '200': {description: Owner-visible grant metadata., content: {application/json: {schema: {$ref: '#/components/schemas/ShareGrant'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/PersistenceUnavailable'}
    delete:
      operationId: revokeShareGrant
      security: [{bearerAuth: []}]
      parameters:
      - $ref: '#/components/parameters/GrantId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {description: Revoked or already-terminal grant., content: {application/json: {schema: {$ref: '#/components/schemas/ShareGrant'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/PersistenceUnavailable'}
  /share-grants/{grant_id}/diagnosis-summary:
    get:
      operationId: getSharedDiagnosisSummary
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/GrantId'}]
      responses:
        '200': {description: Exact active granted diagnosis summary; never a private memory., content: {application/json: {schema: {$ref: '#/components/schemas/DiagnosisSummary'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/PersistenceUnavailable'}
  /teacher/courses/{course_id}/analytics:
    get:
      operationId: getTeacherCourseAnalytics
      x-contract-status: frozen-for-wave-3
      security: [{bearerAuth: []}]
      parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/TeacherConceptIdFilter'
      - $ref: '#/components/parameters/TeacherExerciseIdFilter'
      - $ref: '#/components/parameters/TeacherStartAtFilter'
      - $ref: '#/components/parameters/TeacherEndAtFilter'
      responses:
        '200':
          description: Privacy-preserving course analytics or a suppressed result below five distinct students.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/TeacherAnalyticsAvailable'
                - $ref: '#/components/schemas/TeacherAnalyticsSuppressed'
                discriminator: {propertyName: status}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/PersistenceUnavailable'}
  /teacher/courses/{course_id}/review-queue:
    get:
      operationId: listTeacherReviewQueue
      x-contract-status: frozen-for-wave-3
      security: [{bearerAuth: []}]
      parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/TeacherConceptIdFilter'
      - $ref: '#/components/parameters/TeacherExerciseIdFilter'
      - $ref: '#/components/parameters/TeacherStartAtFilter'
      - $ref: '#/components/parameters/TeacherEndAtFilter'
      responses:
        '200': {description: De-identified diagnoses awaiting teacher review., content: {application/json: {schema: {$ref: '#/components/schemas/TeacherReviewQueue'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/PersistenceUnavailable'}
  /teacher/diagnoses/{diagnosis_id}/review:
    post:
      operationId: reviewTeacherDiagnosis
      x-contract-status: frozen-for-wave-3
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DiagnosisId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TeacherDiagnosisReviewRequest'}}}}
      responses:
        '200': {description: Teacher review metadata; this operation never mutates student learning memory., content: {application/json: {schema: {$ref: '#/components/schemas/TeacherDiagnosisReview'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/PersistenceUnavailable'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Role:
      type: string
      enum:
      - student
      - teacher
    HealthResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - service
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: knowbound-api
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
    Actor:
      type: object
      additionalProperties: false
      required:
      - user_id
      - role
      properties:
        user_id:
          type: string
        role:
          $ref: '#/components/schemas/Role'
    LoginResponse:
      type: object
      additionalProperties: false
      required:
      - access_token
      - token_type
      - actor
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: bearer
        actor:
          $ref: '#/components/schemas/Actor'
    CourseSummary:
      type: object
      additionalProperties: false
      required:
      - course_id
      - title
      properties:
        course_id:
          type: string
        title:
          type: string
    ExerciseSummary:
      type: object
      additionalProperties: false
      required:
      - exercise_id
      - course_id
      - title
      properties:
        exercise_id:
          type: string
        course_id:
          type: string
        title:
          type: string
    CreateCourseRequest:
      type: object
      additionalProperties: false
      required:
      - title
      properties:
        title:
          type: string
    Enrollment:
      type: object
      additionalProperties: false
      required:
      - course_id
      - user_id
      - role
      properties:
        course_id:
          type: string
        user_id:
          type: string
        role:
          $ref: '#/components/schemas/Role'
    KnowledgeId:
      type: string
      pattern: ^cj(\.[a-z0-9]+(-[a-z0-9]+)*){2,}$
      examples:
      - cj.pattern-match.exhaustiveness
      - cj.misconception.match-non-exhaustive
    Topic:
      type: string
      enum:
      - basics_control_flow
      - functions_lambdas_closures
      - class_struct_semantics
      - interface_extension
      - generics_where
      - enum_match
      - option_exceptions
      - concurrency_spawn_future
      - packages_build_tools
    ReviewStatus:
      type: string
      enum:
      - draft
      - pending_review
      - approved
      - rejected
    EdgeType:
      type: string
      enum:
      - prerequisite
      - confusable_with
      - used_by
      - explains_error
    SourceMetadata:
      type: object
      additionalProperties: false
      required:
      - kind
      - references
      - toolchain_version
      - verification_status
      properties:
        kind:
          type: string
          enum:
          - cangjie_coding_kb
          - toolchain_experiment
          - teacher_authored
          - course_material
        references:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        toolchain_version:
          type: string
          minLength: 1
          examples:
          - cjc 1.2.0 (cjnative) / cjpm 1.2.0
        verification_status:
          type: string
          enum:
          - experiment_verified
          - knowledge_base_summary
          - teacher_asserted
          - unverified
        note:
          type: string
    Concept:
      type: object
      additionalProperties: false
      required:
      - id
      - topic
      - title
      - summary
      - review_status
      - source
      properties:
        id:
          $ref: '#/components/schemas/KnowledgeId'
        topic:
          $ref: '#/components/schemas/Topic'
        title:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        review_status:
          $ref: '#/components/schemas/ReviewStatus'
        reviewed_by:
          type:
          - string
          - 'null'
        review_note:
          type:
          - string
          - 'null'
        source:
          $ref: '#/components/schemas/SourceMetadata'
    ConceptCreate:
      description: review_status is server-controlled and must not be supplied.
      type: object
      additionalProperties: false
      required:
      - id
      - topic
      - title
      - summary
      - source
      properties:
        id:
          $ref: '#/components/schemas/KnowledgeId'
        topic:
          $ref: '#/components/schemas/Topic'
        title:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        source:
          $ref: '#/components/schemas/SourceMetadata'
    ConceptUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        topic:
          $ref: '#/components/schemas/Topic'
        title:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        source:
          $ref: '#/components/schemas/SourceMetadata'
    ConceptEdge:
      description: 'prerequisite, confusable_with and used_by connect two concepts; explains_error connects a concept (source)
        to a misconception (target).

        '
      type: object
      additionalProperties: false
      required:
      - source_id
      - target_id
      - edge_type
      properties:
        source_id:
          $ref: '#/components/schemas/KnowledgeId'
        target_id:
          $ref: '#/components/schemas/KnowledgeId'
        edge_type:
          $ref: '#/components/schemas/EdgeType'
        note:
          type:
          - string
          - 'null'
    TriggerEvidence:
      type: object
      additionalProperties: false
      required:
      - kind
      - pattern
      - strength
      properties:
        kind:
          type: string
          enum:
          - compiler_diagnostic
          - runtime_exception
          - code_pattern
          - answer_pattern
        pattern:
          type: string
          minLength: 1
          description: For compiler_diagnostic/runtime_exception, a substring of ANSI-stripped toolchain output.
        strength:
          type: string
          enum:
          - strong
          - weak
          description: weak triggers are shared by several patterns and need corroborating evidence.
    HintStep:
      type: object
      additionalProperties: false
      required:
      - level
      - outline
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 4
        outline:
          type: string
          minLength: 1
    Verification:
      type: object
      additionalProperties: false
      required:
      - method
      - toolchain_version
      - note
      properties:
        method:
          type: string
          enum:
          - cjc_minimal_repro
          - cjpm_project_repro
          - knowledge_base_summary
          - teacher_assertion
        toolchain_version:
          type: string
          minLength: 1
        expected_outcome:
          type:
          - string
          - 'null'
          enum:
          - compile_error
          - runtime_error
          - run_ok
          - null
        snippet:
          type:
          - string
          - 'null'
        project_files:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        expected_output_contains:
          type:
          - string
          - 'null'
        observed:
          type:
          - string
          - 'null'
        note:
          type: string
          minLength: 1
    MisconceptionPattern:
      type: object
      additionalProperties: false
      required:
      - id
      - topic
      - title
      - root_concept_id
      - trigger_evidence
      - explanation
      - hint_ladder
      - review_status
      - source
      - verification
      properties:
        id:
          $ref: '#/components/schemas/KnowledgeId'
        topic:
          $ref: '#/components/schemas/Topic'
        title:
          type: string
          minLength: 1
        root_concept_id:
          $ref: '#/components/schemas/KnowledgeId'
        related_concept_ids:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeId'
        trigger_evidence:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TriggerEvidence'
        explanation:
          type: string
          minLength: 1
        hint_ladder:
          description: Exactly four steps, levels 1..4 in order.
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/HintStep'
        review_status:
          $ref: '#/components/schemas/ReviewStatus'
        reviewed_by:
          type:
          - string
          - 'null'
        review_note:
          type:
          - string
          - 'null'
        source:
          $ref: '#/components/schemas/SourceMetadata'
        verification:
          $ref: '#/components/schemas/Verification'
    MisconceptionCreate:
      description: Same as MisconceptionPattern without review fields.
      type: object
      additionalProperties: false
      required:
      - id
      - topic
      - title
      - root_concept_id
      - trigger_evidence
      - explanation
      - hint_ladder
      - source
      - verification
      properties:
        id:
          $ref: '#/components/schemas/KnowledgeId'
        topic:
          $ref: '#/components/schemas/Topic'
        title:
          type: string
          minLength: 1
        root_concept_id:
          $ref: '#/components/schemas/KnowledgeId'
        related_concept_ids:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeId'
        trigger_evidence:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TriggerEvidence'
        explanation:
          type: string
          minLength: 1
        hint_ladder:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/HintStep'
        source:
          $ref: '#/components/schemas/SourceMetadata'
        verification:
          $ref: '#/components/schemas/Verification'
    MisconceptionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        topic:
          $ref: '#/components/schemas/Topic'
        title:
          type: string
          minLength: 1
        root_concept_id:
          $ref: '#/components/schemas/KnowledgeId'
        related_concept_ids:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeId'
        trigger_evidence:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TriggerEvidence'
        explanation:
          type: string
          minLength: 1
        hint_ladder:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/HintStep'
        source:
          $ref: '#/components/schemas/SourceMetadata'
        verification:
          $ref: '#/components/schemas/Verification'
    ReviewDecision:
      type: object
      additionalProperties: false
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - approved
          - rejected
        note:
          type:
          - string
          - 'null'
    SubmissionStatus:
      type: string
      enum:
      - received
      - executing
      - executed
      - execution_unavailable
      - diagnosing
      - diagnosed
      - needs_review
    SourceFileInput:
      type: object
      additionalProperties: false
      required:
      - path
      - content
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 255
          description: Relative POSIX .cj path; also limited to 255 UTF-8 bytes.
        content:
          type: string
          maxLength: 262144
          description: Also limited to 256 KiB UTF-8 bytes per file and 1 MiB total.
    SubmissionCreateRequest:
      type: object
      additionalProperties: false
      required:
      - source_files
      - entrypoint
      properties:
        source_files:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/SourceFileInput'
        entrypoint:
          type: string
          minLength: 1
          maxLength: 255
        is_formal:
          type: boolean
          default: true
    Submission:
      type: object
      additionalProperties: false
      required:
      - submission_id
      - course_id
      - exercise_id
      - owner_user_id
      - source_files
      - entrypoint
      - is_formal
      - status
      - created_at
      - request_id
      properties:
        submission_id:
          type: string
        course_id:
          type: string
          readOnly: true
        exercise_id:
          type: string
          readOnly: true
        owner_user_id:
          type: string
          readOnly: true
        source_files:
          type: array
          items:
            $ref: '#/components/schemas/SourceFileInput'
        entrypoint:
          type: string
        is_formal:
          type: boolean
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        created_at:
          type: string
          format: date-time
        request_id:
          type: string
    CompilerDiagnostic:
      type: object
      additionalProperties: false
      required:
      - severity
      - message
      - code
      - file
      - start_line
      - start_column
      - end_line
      - end_column
      properties:
        severity: {type: string}
        message: {type: string}
        code: {type: [string, 'null']}
        file: {type: [string, 'null']}
        start_line: {type: [integer, 'null']}
        start_column: {type: [integer, 'null']}
        end_line: {type: [integer, 'null']}
        end_column: {type: [integer, 'null']}
    CommandSummary:
      type: object
      additionalProperties: false
      required:
      - compiler
      - source_count
      - entrypoint
      - output_kind
      properties:
        compiler: {type: string, const: cjc}
        source_count: {type: integer, minimum: 0, maximum: 32}
        entrypoint: {type: string}
        output_kind: {type: string, const: executable}
    RunnerLimits:
      type: object
      additionalProperties: false
      required:
      - timeout_ms
      - max_output_chars
      - max_files
      - max_source_bytes
      - pids
      - memory_bytes
      - cpu_cores
      properties:
        timeout_ms: {type: integer}
        max_output_chars: {type: integer}
        max_files: {type: integer}
        max_source_bytes: {type: integer}
        pids: {type: integer}
        memory_bytes: {type: integer}
        cpu_cores: {type: number}
    ToolchainInfo:
      type: object
      additionalProperties: false
      required:
      - cjc
      - cjpm
      - backend
      properties:
        cjc: {type: string}
        cjpm: {type: string}
        backend: {type: string, const: cjnative}
    RuleMatch:
      type: object
      additionalProperties: false
      required:
      - misconception_id
      - root_concept_id
      - related_concept_ids
      - diagnostic_indices
      - evidence_kind
      - evidence_summary
      - source_references
      - match_strength
      properties:
        misconception_id: {type: string}
        root_concept_id: {type: string}
        related_concept_ids:
          type: array
          items: {type: string}
        diagnostic_indices:
          type: array
          items: {type: integer, minimum: 0}
        evidence_kind: {type: string, const: compiler_diagnostic}
        evidence_summary: {type: string}
        source_references:
          type: array
          items: {type: string}
        match_strength: {type: string, enum: [strong, weak]}
    ExecutionResult:
      type: object
      additionalProperties: false
      required:
      - submission_id
      - protocol_version
      - status
      - phase
      - retryable
      - exit_code
      - signal
      - stdout
      - stderr
      - stdout_truncated
      - stderr_truncated
      - diagnostics
      - command_summary
      - limits
      - toolchain
      - created_at
      - request_id
      - rule_matches
      properties:
        submission_id: {type: string}
        protocol_version: {type: string, const: '2'}
        status:
          type: string
          enum: [succeeded, compile_failed, run_failed, timed_out, resource_exhausted]
        phase: {type: string, enum: [compile, run, control]}
        retryable: {type: boolean}
        exit_code: {type: [integer, 'null']}
        signal: {type: [integer, 'null']}
        stdout: {type: string, maxLength: 65536}
        stderr: {type: string, maxLength: 65536}
        stdout_truncated: {type: boolean}
        stderr_truncated: {type: boolean}
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/CompilerDiagnostic'
        command_summary:
          $ref: '#/components/schemas/CommandSummary'
        limits:
          $ref: '#/components/schemas/RunnerLimits'
        toolchain:
          $ref: '#/components/schemas/ToolchainInfo'
        created_at: {type: string, format: date-time}
        request_id: {type: string}
        rule_matches:
          type: array
          items:
            $ref: '#/components/schemas/RuleMatch'
    NextHintRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 512}
    ExplanationCheckRequest:
      type: object
      additionalProperties: false
      required: [explanation]
      properties:
        explanation: {type: string, minLength: 1, maxLength: 8000}
    DiagnosisLocation:
      type: object
      additionalProperties: false
      required: [file, start_line, end_line]
      properties:
        file: {type: string, minLength: 1}
        start_line: {type: integer, minimum: 1}
        end_line: {type: integer, minimum: 1}
    CompilerDiagnosticEvidence:
      type: object
      additionalProperties: false
      required: [kind, summary, diagnostic_index]
      properties:
        kind: {type: string, const: compiler_diagnostic}
        summary: {type: string, minLength: 1}
        diagnostic_index: {type: integer, minimum: 0}
    RuleMatchEvidence:
      type: object
      additionalProperties: false
      required: [kind, summary, misconception_id]
      properties:
        kind: {type: string, const: rule_match}
        summary: {type: string, minLength: 1}
        misconception_id: {type: string, minLength: 1}
    ApprovedKnowledgeEvidence:
      type: object
      additionalProperties: false
      required: [kind, summary, misconception_id, source_reference]
      properties:
        kind: {type: string, const: approved_knowledge}
        summary: {type: string, minLength: 1}
        misconception_id: {type: string, minLength: 1}
        source_reference: {type: string, minLength: 1}
    EvidenceBinding:
      oneOf:
      - $ref: '#/components/schemas/CompilerDiagnosticEvidence'
      - $ref: '#/components/schemas/RuleMatchEvidence'
      - $ref: '#/components/schemas/ApprovedKnowledgeEvidence'
      discriminator:
        propertyName: kind
        mapping:
          compiler_diagnostic: '#/components/schemas/CompilerDiagnosticEvidence'
          rule_match: '#/components/schemas/RuleMatchEvidence'
          approved_knowledge: '#/components/schemas/ApprovedKnowledgeEvidence'
    Diagnosis:
      type: object
      additionalProperties: false
      required: [diagnosis_id, submission_id, course_id, owner_user_id, category, locations, concept_ids, root_cause, evidence, confidence, recommended_hint_level, requires_teacher_review, created_at, request_id]
      properties:
        diagnosis_id: {type: string}
        submission_id: {type: string}
        course_id: {type: string, readOnly: true}
        owner_user_id: {type: string, readOnly: true}
        category: {type: string, enum: [conceptual, strategic, procedural, expression]}
        locations:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/DiagnosisLocation'}
        concept_ids:
          type: array
          minItems: 1
          items: {type: string}
        root_cause: {type: string, minLength: 1}
        evidence:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/EvidenceBinding'}
        confidence: {type: number, minimum: 0, maximum: 1}
        recommended_hint_level: {type: integer, minimum: 1, maximum: 4}
        requires_teacher_review: {type: boolean, readOnly: true}
        created_at: {type: string, format: date-time}
        request_id: {type: string}
    HintEvent:
      type: object
      additionalProperties: false
      required: [hint_event_id, diagnosis_id, previous_level, current_level, reason, previous_attempt_count, content, used_safe_fallback, created_at, request_id]
      properties:
        hint_event_id: {type: string}
        diagnosis_id: {type: string}
        previous_level: {type: integer, minimum: 0, maximum: 3}
        current_level: {type: integer, minimum: 1, maximum: 4}
        reason: {type: string, minLength: 1}
        previous_attempt_count: {type: integer, minimum: 0}
        content: {type: string, minLength: 1}
        used_safe_fallback: {type: boolean}
        created_at: {type: string, format: date-time}
        request_id: {type: string}
