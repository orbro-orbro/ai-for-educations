openapi: 3.1.0
info:
  title: KnowBound-CJ API — Task 7 memories fragment
  version: 0.1.0
paths:
  /me/memory-proposals:
    get:
      operationId: listMyMemoryProposals
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CourseIdQuery'}]
      responses:
        '200': {description: Current student's course-scoped proposals., content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MemoryProposal'}}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
  /memory-proposals/{proposal_id}/accept:
    post:
      operationId: acceptMemoryProposal
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProposalId'}]
      responses:
        '200': {description: The one active memory created by student acceptance., content: {application/json: {schema: {$ref: '#/components/schemas/LearningMemory'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/Conflict'}
  /memory-proposals/{proposal_id}/reject:
    post:
      operationId: rejectMemoryProposal
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProposalId'}]
      responses:
        '200': {description: Rejected proposal., content: {application/json: {schema: {$ref: '#/components/schemas/MemoryProposal'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/Conflict'}
  /memory-proposals/{proposal_id}:
    patch:
      operationId: correctMemoryProposal
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProposalId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProposalCorrectionRequest'}}}}
      responses:
        '200': {description: New immutable proposal version., content: {application/json: {schema: {$ref: '#/components/schemas/MemoryProposal'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /me/memories:
    get:
      operationId: listMyLearningMemories
      security: [{bearerAuth: []}]
      parameters:
      - {$ref: '#/components/parameters/CourseIdQuery'}
      - {name: query, in: query, required: false, schema: {type: string}}
      - {name: purpose, in: query, required: false, schema: {type: string, default: learning_support}}
      responses:
        '200': {description: Authorized active memories for the current student and course., content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/LearningMemory'}}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
  /memories/{memory_id}:
    patch:
      operationId: correctLearningMemory
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/MemoryId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryCorrectionRequest'}}}}
      responses:
        '200': {description: New active immutable memory version., content: {application/json: {schema: {$ref: '#/components/schemas/LearningMemory'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      operationId: deleteLearningMemory
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/MemoryId'}]
      responses:
        '202': {description: Deletion receipt; pending is already non-retrievable., content: {application/json: {schema: {$ref: '#/components/schemas/DeletionReceipt'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
  /memory-deletions/{deletion_id}:
    get:
      operationId: getMemoryDeletion
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeletionId'}]
      responses:
        '200': {description: Owner-visible deletion status without private text., content: {application/json: {schema: {$ref: '#/components/schemas/DeletionReceipt'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
  /memory-deletions/{deletion_id}/retry:
    post:
      operationId: retryMemoryDeletion
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeletionId'}]
      responses:
        '200': {description: Idempotent compensation result., content: {application/json: {schema: {$ref: '#/components/schemas/DeletionReceipt'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
  /diagnoses/{diagnosis_id}/share-grants:
    post:
      operationId: createDiagnosisShareGrant
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DiagnosisId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ShareGrantCreateRequest'}}}}
      responses:
        '201': {description: Exact diagnosis-summary grant., content: {application/json: {schema: {$ref: '#/components/schemas/ShareGrant'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
        '422': {$ref: '#/components/responses/Invalid'}
  /me/share-grants:
    get:
      operationId: listMyShareGrants
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CourseIdQuery'}]
      responses:
        '200': {description: Current student's exact grants., content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ShareGrant'}}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
  /share-grants/{grant_id}:
    get:
      operationId: getShareGrant
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/GrantId'}]
      responses:
        '200': {description: Owner-visible grant metadata., content: {application/json: {schema: {$ref: '#/components/schemas/ShareGrant'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
    delete:
      operationId: revokeShareGrant
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/GrantId'}]
      responses:
        '200': {description: Revoked or already-terminal grant., content: {application/json: {schema: {$ref: '#/components/schemas/ShareGrant'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
  /share-grants/{grant_id}/diagnosis-summary:
    get:
      operationId: getSharedDiagnosisSummary
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/GrantId'}]
      responses:
        '200': {description: Exact active granted diagnosis summary; never a private memory., content: {application/json: {schema: {$ref: '#/components/schemas/DiagnosisSummary'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotAvailable'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    CourseIdQuery: {name: course_id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    ProposalId: {name: proposal_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    MemoryId: {name: memory_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    DeletionId: {name: deletion_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    DiagnosisId: {name: diagnosis_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    GrantId: {name: grant_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties: {code: {type: string}, message: {type: string}, request_id: {type: string}}
    ProposalCorrectionRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties: {content: {type: string, minLength: 1, maxLength: 8000, pattern: '.*\S.*'}}
    MemoryCorrectionRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties: {content: {type: string, minLength: 1, maxLength: 8000, pattern: '.*\S.*'}}
    ShareGrantCreateRequest:
      type: object
      additionalProperties: false
      required: [grantee_user_id, purpose]
      properties:
        grantee_user_id: {type: string, minLength: 1, maxLength: 128}
        purpose: {type: string, minLength: 1, maxLength: 256}
        expires_at: {type: [string, 'null'], format: date-time}
    MemoryProposal:
      type: object
      additionalProperties: false
      required: [proposal_id, root_proposal_id, previous_proposal_id, version, owner_user_id, course_id, diagnosis_id, explanation_check_id, content, concept_ids, confidence, status, created_at, expires_at, request_id]
      properties:
        proposal_id: {type: string}
        root_proposal_id: {type: string}
        previous_proposal_id: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
        owner_user_id: {type: string, readOnly: true}
        course_id: {type: string, readOnly: true}
        diagnosis_id: {type: string, readOnly: true}
        explanation_check_id: {type: string, readOnly: true}
        content: {type: string}
        concept_ids: {type: array, items: {type: string}}
        confidence: {type: number, minimum: 0, maximum: 1}
        status: {type: string, enum: [pending, accepted, rejected, superseded, expired]}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        request_id: {type: string}
    LearningMemory:
      type: object
      additionalProperties: false
      required: [memory_id, logical_memory_id, previous_version_id, version, owner_user_id, course_id, memory_type, visibility, content, concept_ids, source_diagnosis_id, confidence, allowed_purposes, status, created_at, updated_at, expires_at, request_id]
      properties:
        memory_id: {type: string}
        logical_memory_id: {type: string}
        previous_version_id: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
        owner_user_id: {type: string, readOnly: true}
        course_id: {type: string, readOnly: true}
        memory_type: {type: string}
        visibility: {type: string, const: private}
        content: {type: [string, 'null']}
        concept_ids: {type: array, items: {type: string}}
        source_diagnosis_id: {type: string, readOnly: true}
        confidence: {type: number, minimum: 0, maximum: 1}
        allowed_purposes: {type: array, items: {type: string}}
        status: {type: string, enum: [active, superseded, expired, deletion_pending, deleted]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        request_id: {type: string}
    ShareGrant:
      type: object
      additionalProperties: false
      required: [grant_id, owner_user_id, course_id, resource_type, resource_id, grantee_user_id, purpose, status, created_at, expires_at, revoked_at, request_id]
      properties:
        grant_id: {type: string}
        owner_user_id: {type: string, readOnly: true}
        course_id: {type: string, readOnly: true}
        resource_type: {type: string, const: diagnosis_summary}
        resource_id: {type: string, readOnly: true}
        grantee_user_id: {type: string}
        purpose: {type: string}
        status: {type: string, enum: [active, revoked, expired]}
        created_at: {type: string, format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
        request_id: {type: string}
    DeletionReceipt:
      type: object
      additionalProperties: false
      required: [deletion_id, memory_id, owner_user_id, course_id, status, requested_at, completed_at, attempts, index_cleared, cache_cleared, model_references_cleared, reverse_lookup_absent, error_code, request_id]
      properties:
        deletion_id: {type: string}
        memory_id: {type: string}
        owner_user_id: {type: string, readOnly: true}
        course_id: {type: string, readOnly: true}
        status: {type: string, enum: [deletion_pending, deleted]}
        requested_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        attempts: {type: integer, minimum: 0}
        index_cleared: {type: boolean}
        cache_cleared: {type: boolean}
        model_references_cleared: {type: boolean}
        reverse_lookup_absent: {type: boolean}
        error_code: {type: [string, 'null']}
        request_id: {type: string}
    DiagnosisSummary:
      type: object
      additionalProperties: false
      required: [diagnosis_id, owner_user_id, course_id, category, concept_ids, root_cause, confidence]
      properties:
        diagnosis_id: {type: string}
        owner_user_id: {type: string, readOnly: true}
        course_id: {type: string, readOnly: true}
        category: {type: string}
        concept_ids: {type: array, items: {type: string}}
        root_cause: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
  responses:
    AuthenticationFailed: {description: Missing or invalid bearer token., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotAvailable: {description: Unknown, foreign and unauthorized resources are indistinguishable., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Conflict: {description: Memory lifecycle state does not permit the operation., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Invalid: {description: Strict request validation failed., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
