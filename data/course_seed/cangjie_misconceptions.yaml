  # ================================================================ 5 generics / where
  - id: cj.misconception.generic-operator-without-constraint
    topic: generics_where
    title: "对未约束的泛型参数使用运算符"
    root_concept_id: cj.generic.where-constraint
    related_concept_ids: [cj.generic.type-parameters, cj.interface.declaration]
    trigger_evidence:
      - {kind: compiler_diagnostic, pattern: "on type 'Generics-", strength: strong}
    explanation: "未加约束的类型参数 T 不具备任何具体能力；要使用 > 等操作，必须用 where T <: Comparable<T> 声明该能力。"
    hint_ladder:
      - {level: 1, outline: "编译器能否确定任意类型 T 都支持 > ？"}
      - {level: 2, outline: "回顾泛型约束 where 如何声明类型参数的能力。"}
      - {level: 3, outline: "在签名后添加 where T <: Comparable<T>。"}
      - {level: 4, outline: "完整解析：func maxOf<T>(a: T, b: T): T where T <: Comparable<T> { if (a > b) { a } else { b } } 可编译，maxOf(1, 2) 输出 2。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "cjc 1.2.0 报 invalid binary operator '>' on type 'Generics-T'；加约束后可运行。"
    source:
      kind: toolchain_experiment
      references: ["exp:generic_missing_where", "exp:generic_where_ok", "kb:examples.abstractions.generic-constraint"]
      toolchain_version: cjc 1.2.0 (cjnative) / cjpm 1.2.0
      verification_status: experiment_verified
    verification:
      method: cjc_minimal_repro
      toolchain_version: cjc 1.2.0 (cjnative)
      expected_outcome: compile_error
      observed: "invalid binary operator '>'"
      snippet: |
        func maxOf<T>(a: T, b: T): T {
            if (a > b) { a } else { b }
        }
        main() { println(maxOf(1, 2)) }
      note: "编译期拒绝。"

  - id: cj.misconception.where-inside-angle-brackets
    topic: generics_where
    title: "把 where 约束写进尖括号"
    root_concept_id: cj.generic.where-clause-position
    related_concept_ids: [cj.generic.where-constraint]
    trigger_evidence:
      - {kind: code_pattern, pattern: "在 <T ...> 类型参数列表内书写 where 子句", strength: strong}
      - {kind: compiler_diagnostic, pattern: "unclosed delimiter: '<'", strength: weak}
    explanation: "仓颉的 where 子句位于函数签名（返回类型）之后、函数体之前，不能写在类型参数列表的尖括号内。"
    hint_ladder:
      - {level: 1, outline: "编译器认为哪个括号没有闭合？"}
      - {level: 2, outline: "回顾 where 子句在泛型函数声明中的位置。"}
      - {level: 3, outline: "把约束移到返回类型之后、左花括号之前。"}
      - {level: 4, outline: "完整解析：func maxOf<T where T <: Comparable<T>>(...) 改为 func maxOf<T>(a: T, b: T): T where T <: Comparable<T> { ... }。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "cjc 1.2.0 报 unclosed delimiter: '<'。"
    source:
      kind: toolchain_experiment
      references: ["exp:generic_where_inside_angle", "exp:generic_where_ok"]
      toolchain_version: cjc 1.2.0 (cjnative) / cjpm 1.2.0
      verification_status: experiment_verified
    verification:
      method: cjc_minimal_repro
      toolchain_version: cjc 1.2.0 (cjnative)
      expected_outcome: compile_error
      observed: unclosed delimiter
      snippet: |
        func maxOf<T where T <: Comparable<T>>(a: T, b: T): T {
            if (a > b) { a } else { b }
        }
        main() { println(maxOf(1, 2)) }
      note: "语法错误，诊断文本较通用。"

  # ================================================================ 8 spawn / Future
  - id: cj.misconception.spawn-get-immediately-serializes
    topic: concurrency_spawn_future
    title: "spawn 后立即 get，把并发写成串行"
    root_concept_id: cj.concurrency.get-placement-parallelism
    related_concept_ids: [cj.concurrency.spawn, cj.concurrency.future-get]
    trigger_evidence:
      - {kind: code_pattern, pattern: "spawn { ... }.get() 链式调用，或每次 spawn 后紧接着对同一 Future 调用 get()", strength: strong}
      - {kind: answer_pattern, pattern: "认为只要使用 spawn 任务就一定并行执行", strength: strong}
    explanation: "get() 会阻塞直到任务完成；每次 spawn 后立即 get 会让下一个任务在前一个结束后才启动。应先启动全部任务，再统一 get。"
    hint_ladder:
      - {level: 1, outline: "第二个任务是在第一个任务结束之前还是之后启动的？"}
      - {level: 2, outline: "回顾 Future.get() 的阻塞语义。"}
      - {level: 3, outline: "先把所有 spawn 返回的 Future 保存到变量或集合，再依次 get。"}
      - {level: 4, outline: "完整解析：spawn{...}.get() 两次串行耗时约为两者之和；let f1 = spawn{...}; let f2 = spawn{...}; f1.get() + f2.get() 让两个任务重叠执行。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "本机 1.2.0 单次测量中立即 get 总耗时 ≥550ms，先启动后 get <550ms；计时依赖机器负载。"
    source:
      kind: toolchain_experiment
      references: ["exp:spawn_get_placement", "kb:language.concurrency.6-访问线程.6-1-future-线程句柄"]
      toolchain_version: cjc 1.2.0 (cjnative) / cjpm 1.2.0
      verification_status: experiment_verified
    verification:
      method: cjc_minimal_repro
      toolchain_version: cjc 1.2.0 (cjnative)
      expected_outcome: run_ok
      expected_output_contains: "serial_ge_550=true parallel_lt_550=true"
      snippet: |
        import std.time.*
        main() {
            let t0 = MonoTime.now()
            let s1 = spawn { => sleep(Duration.millisecond * 300); 1 }.get()
            let s2 = spawn { => sleep(Duration.millisecond * 300); 2 }.get()
            let serial = (MonoTime.now() - t0).toMilliseconds()
            let t1 = MonoTime.now()
            let f1 = spawn { => sleep(Duration.millisecond * 300); 1 }
            let f2 = spawn { => sleep(Duration.millisecond * 300); 2 }
            let p = f1.get() + f2.get()
            let parallel = (MonoTime.now() - t1).toMilliseconds()
            println("sum=${s1 + s2 + p} serial_ge_550=${serial >= 550} parallel_lt_550=${parallel < 550}")
        }
      note: "计时型实验，在高负载机器上可能需要重跑。"

  - id: cj.misconception.future-exception-ignored
    topic: concurrency_spawn_future
    title: "认为子任务异常不会影响 get 的调用方"
    root_concept_id: cj.concurrency.future-exception-propagation
    related_concept_ids: [cj.concurrency.future-get, cj.exception.try-catch-finally]
    trigger_evidence:
      - {kind: answer_pattern, pattern: "认为 spawn 任务内抛出的异常会被吞掉，get() 照常返回", strength: strong}
      - {kind: code_pattern, pattern: "对可能抛异常的任务调用 get() 时没有任何异常处理", strength: weak}
    explanation: "任务中未捕获的异常会在 get() 处重新抛出，调用方需要在 get 处处理；cjc 1.2.0 运行时还会把该线程的异常栈打印到输出。"
    hint_ladder:
      - {level: 1, outline: "任务内抛出的异常最终在哪个线程、哪一行被观察到？"}
      - {level: 2, outline: "回顾 Future.get() 对任务异常的传播语义。"}
      - {level: 3, outline: "用 try { f.get() } catch (e: Exception) { ... } 包住 get 调用。"}
      - {level: 4, outline: "完整解析：任务抛出 Exception(\"boom\")，f.get() 重新抛出，外层 catch 打印 caught boom。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "cjc 1.2.0 输出 caught boom，并同时打印线程异常栈，进程退出码 0。"
    source:
      kind: toolchain_experiment
      references: ["exp:future_get_rethrows", "kb:language.concurrency.6-访问线程.6-1-future-线程句柄"]
      toolchain_version: cjc 1.2.0 (cjnative) / cjpm 1.2.0
      verification_status: experiment_verified
    verification:
      method: cjc_minimal_repro
      toolchain_version: cjc 1.2.0 (cjnative)
      expected_outcome: run_ok
      expected_output_contains: caught boom
      snippet: |
        main() {
            let f = spawn { =>
                if (true) { throw Exception("boom") }
                1
            }
            try {
                f.get()
                println("no exception")
            } catch (e: Exception) {
                println("caught ${e.message}")
            }
        }
      note: "异常栈打印行为为 1.2.0 实测，未在其他版本验证。"

  # ================================================================ 1 基础与控制流
  - id: cj.misconception.for-in-variable-reassign
    topic: basics_control_flow
    title: "修改 for-in 中的不可变循环变量"
    root_concept_id: cj.basics.for-in-binding-immutable
    related_concept_ids: [cj.basics.for-in-range, cj.basics.let-var-binding]
    trigger_evidence:
      - {kind: code_pattern, pattern: "在 for-in 循环体内对循环变量赋值以“跳过”或“调整”迭代", strength: strong}
      - {kind: compiler_diagnostic, pattern: "cannot assign to immutable value", strength: weak}
    explanation: "for-in 的循环变量是每轮迭代新建的不可变绑定，不能在循环体内赋值；需要可变计数时使用 var 与 while，或调整 Range/步长。"
    hint_ladder:
      - {level: 1, outline: "报错的赋值目标是谁声明的？"}
      - {level: 2, outline: "回顾 for-in 循环变量的可变性。"}
      - {level: 3, outline: "若需跳步，改用带步长的 Range 或 var + while；若需派生值，另声明 let j = i + 1。"}
      - {level: 4, outline: "完整解析：for (i in 0..3) { i = i + 1 } 被拒绝；用 let j = i + 1 或 while 循环表达意图。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "cjc 1.2.0 报 cannot assign to immutable value。"
    source:
      kind: toolchain_experiment
      references: ["exp:for_in_var_immutable", "kb:language.for"]
      toolchain_version: cjc 1.2.0 (cjnative) / cjpm 1.2.0
      verification_status: experiment_verified
    verification:
      method: cjc_minimal_repro
      toolchain_version: cjc 1.2.0 (cjnative)
      expected_outcome: compile_error
      observed: cannot assign to immutable value
      snippet: |
        main() {
            for (i in 0..3) {
                i = i + 1
            }
        }
      note: "诊断文本与其他不可变赋值共享。"

