  - id: cj.misconception.if-without-else-as-value
    topic: basics_control_flow
    title: "把无 else 的 if 当作有值表达式"
    root_concept_id: cj.basics.if-expression-value
    related_concept_ids: [cj.basics.if-bool-condition]
    trigger_evidence:
      - {kind: code_pattern, pattern: "把没有 else 分支的 if 赋给非 Unit 类型的变量", strength: strong}
      - {kind: compiler_diagnostic, pattern: "mismatched types", strength: weak}
    explanation: "if 是表达式，但没有 else 时条件不成立的分支没有值，整体类型为 Unit；要作为值使用必须补充 else。"
    hint_ladder:
      - {level: 1, outline: "条件为 false 时这个 if 应该得到什么值？"}
      - {level: 2, outline: "回顾 if 表达式的类型规则。"}
      - {level: 3, outline: "补充 else 分支并保证两个分支类型一致。"}
      - {level: 4, outline: "完整解析：let v: Int64 = if (true) { 1 } 不合法；写成 if (cond) { 1 } else { 0 }。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "cjc 1.2.0 报 mismatched types。"
    source:
      kind: toolchain_experiment
      references: ["exp:if_without_else_as_value"]
      toolchain_version: cjc 1.2.0 (cjnative) / cjpm 1.2.0
      verification_status: experiment_verified
    verification:
      method: cjc_minimal_repro
      toolchain_version: cjc 1.2.0 (cjnative)
      expected_outcome: compile_error
      observed: mismatched types
      snippet: |
        main() {
            let v: Int64 = if (true) { 1 }
            println(v)
        }
      note: "mismatched types 为通用诊断。"

  # ================================================================ 2 函数 / 闭包
  - id: cj.misconception.closure-escaping-mutable-capture
    topic: functions_lambdas_closures
    title: "返回捕获了 var 的闭包"
    root_concept_id: cj.function.closure-mutable-capture-escape
    related_concept_ids: [cj.function.closure-capture, cj.basics.let-var-binding]
    trigger_evidence:
      - {kind: compiler_diagnostic, pattern: "lambda capturing mutable variables needs to be called directly", strength: strong}
    explanation: "捕获可变局部变量 var 的 Lambda 只能被直接调用，不能返回或存储；需要保存状态时让闭包捕获 let 绑定的 class 实例。"
    hint_ladder:
      - {level: 1, outline: "这个 Lambda 捕获了哪些外部变量？它们是 let 还是 var？"}
      - {level: 2, outline: "回顾仓颉对捕获可变变量的闭包的逃逸限制。"}
      - {level: 3, outline: "把计数器放进一个 class，并用 let 绑定该对象后再捕获。"}
      - {level: 4, outline: "完整解析：var c 被返回的 Lambda 捕获而报错；改为 let b = Box() 并在 Lambda 中修改 b.n，连续调用可得到 1、2。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "cjc 1.2.0 报 lambda capturing mutable variables needs to be called directly；let 引用对象版本输出 2。"
    source:
      kind: toolchain_experiment
      references: ["exp:closure_var_escape", "exp:lambda_capture_let_ref_ok", "kb:examples.functions.closure-state"]
      toolchain_version: cjc 1.2.0 (cjnative) / cjpm 1.2.0
      verification_status: experiment_verified
    verification:
      method: cjc_minimal_repro
      toolchain_version: cjc 1.2.0 (cjnative)
      expected_outcome: compile_error
      observed: lambda capturing mutable variables needs to be called directly
      snippet: |
        func make(): () -> Int64 {
            var c = 0
            return { => c += 1; c }
        }
        main() {
            let f = make()
            println(f())
        }
      note: "编译期拒绝。"

  - id: cj.misconception.named-param-positional-call
    topic: functions_lambdas_closures
    title: "按位置传递命名参数"
    root_concept_id: cj.function.named-parameters
    related_concept_ids: [cj.function.declaration]
    trigger_evidence:
      - {kind: compiler_diagnostic, pattern: "missing argument prefix", strength: strong}
    explanation: "声明为 p!: T 的命名参数调用时必须写 p: value，不能按位置传入；有默认值时可以省略。"
    hint_ladder:
      - {level: 1, outline: "函数声明里这个参数名后面有什么特殊符号？"}
      - {level: 2, outline: "回顾命名参数的声明与调用写法。"}
      - {level: 3, outline: "在实参前加上参数名和冒号。"}
      - {level: 4, outline: "完整解析：func f(a!: Int64) 须调用 f(a: 1)；若声明 a!: Int64 = 3 还可调用 f()。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "cjc 1.2.0 报 missing argument prefix 'a:' for named parameter。"
    source:
      kind: toolchain_experiment
      references: ["exp:named_param_positional_call", "exp:named_param_ok"]
      toolchain_version: cjc 1.2.0 (cjnative) / cjpm 1.2.0
      verification_status: experiment_verified
    verification:
      method: cjc_minimal_repro
      toolchain_version: cjc 1.2.0 (cjnative)
      expected_outcome: compile_error
      observed: missing argument prefix
      snippet: |
        func f(a!: Int64): Int64 { a }
        main() { println(f(1)) }
      note: "编译期拒绝。"

  # ================================================================ 9 包与构建
  - id: cj.misconception.package-name-path-mismatch
    topic: packages_build_tools
    title: "包声明与目录路径不一致"
    root_concept_id: cj.package.package-declaration-path
    related_concept_ids: [cj.tools.cjpm-project-build]
    trigger_evidence:
      - {kind: compiler_diagnostic, pattern: "is wrong, the right name should be", strength: strong}
    explanation: "cjpm 项目中 src 下每个子目录对应一个子包，文件的 package 声明必须与目录路径一致（如 src/util 对应 <模块名>.util）。"
    hint_ladder:
      - {level: 1, outline: "报错文件位于哪个目录？它声明的包名是什么？"}
      - {level: 2, outline: "回顾 cjpm 项目中包名与目录结构的对应规则。"}
      - {level: 3, outline: "按提示修改 package 声明，或把文件移动到与包名对应的目录。"}
      - {level: 4, outline: "完整解析：src/util/u.cj 声明 package demo.wrong，cjpm 要求为 demo.util；改正后 cjpm build 成功。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "cjpm 1.2.0 报 the package name in ...src\\util is wrong, the right name should be 'demo.util'。"
    source:
      kind: toolchain_experiment
      references: ["exp:cjpm_pkg_mismatch", "kb:language.package"]
      toolchain_version: cjc 1.2.0 (cjnative) / cjpm 1.2.0
      verification_status: experiment_verified
    verification:
      method: cjpm_project_repro
      toolchain_version: cjpm 1.2.0
      expected_outcome: compile_error
      observed: "the right name should be 'demo.util'"
      project_files:
        src/util/u.cj: |
          package demo.wrong

          public func one(): Int64 { 1 }
      note: "在 cjpm init --name demo --type=executable 生成的项目上添加该文件后执行 cjpm build。"

