      - {level: 1, outline: "扩展体里出现了哪一类声明？"}
      - {level: 2, outline: "回顾扩展允许添加的成员种类。"}
      - {level: 3, outline: "把状态字段放回原类型定义，或用外部映射/包装类型保存。"}
      - {level: 4, outline: "完整解析：extend Sq { var extra: Int64 = 0 } 不合法；应在 class Sq 中声明 extra，扩展中只添加函数或属性。"}
