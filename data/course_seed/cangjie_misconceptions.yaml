misconceptions:
  # ================================================================ 3 class / struct
  - id: cj.misconception.struct-copied-as-reference
    topic: class_struct_semantics
    title: "把 struct 当作引用类型"
    root_concept_id: cj.type.struct-value-semantics
    related_concept_ids: [cj.type.class-reference-semantics]
    trigger_evidence:
      - {kind: code_pattern, pattern: "把 struct 实例赋给另一变量后修改副本，并期望原变量随之改变", strength: strong}
      - {kind: answer_pattern, pattern: "认为 struct 与 class 赋值后都指向同一个对象", strength: strong}
    explanation: "struct 是值类型，赋值和传参时复制整个实例；class 是引用类型，赋值后共享同一对象。修改 struct 副本不会影响原变量。"
    hint_ladder:
      - {level: 1, outline: "对比程序输出中 a.x 与 c.x：两者都“通过另一个变量修改过”，为什么结果不同？"}
      - {level: 2, outline: "回顾值类型（struct）与引用类型（class）在赋值时分别复制什么。"}
      - {level: 3, outline: "画出 a、b、c、d 赋值后的内存关系；若希望共享修改，改用 class 或把修改后的副本写回原变量。"}
      - {level: 4, outline: "完整解析：var b = a 复制了 P 实例，b.x = 2 只改副本；let d = c 复制的是引用，d.x = 2 修改的是同一个 C 对象，因此输出 1 2。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "程序输出 1 2 与解释一致（cjc 1.2.0）。"
    source:
      kind: toolchain_experiment
      references: ["exp:struct_vs_class_copy", "kb:language.struct", "kb:language.class"]
      toolchain_version: cjc 1.2.0 (cjnative) / cjpm 1.2.0
      verification_status: experiment_verified
    verification:
      method: cjc_minimal_repro
      toolchain_version: cjc 1.2.0 (cjnative)
      expected_outcome: run_ok
      expected_output_contains: "1 2"
      snippet: |
        struct P { var x: Int64; init(x: Int64) { this.x = x } }
        class C { var x: Int64; init(x: Int64) { this.x = x } }
        main() {
            var a = P(1)
            var b = a
            b.x = 2
            let c = C(1)
            let d = c
            d.x = 2
            println("${a.x} ${c.x}")
        }
      note: "struct 副本修改不影响原值，class 引用共享修改。"

  - id: cj.misconception.array-assignment-deep-copy
    topic: class_struct_semantics
    title: "误以为 Array 赋值会复制全部元素"
    root_concept_id: cj.collections.array-shared-buffer
    related_concept_ids: [cj.type.struct-value-semantics]
    trigger_evidence:
      - {kind: code_pattern, pattern: "let b = a 后修改 b[i]，并期望数组 a 保持不变", strength: strong}
      - {kind: answer_pattern, pattern: "认为 Array 是 struct，所以赋值后两份数据完全独立", strength: strong}
    explanation: "Array<T> 赋值不会复制元素，新旧变量共享同一份元素存储，通过任一变量修改元素都对另一个可见；需要独立数据时调用 clone()。"
    hint_ladder:
      - {level: 1, outline: "修改 b[0] 之后打印 a[0]，结果和你的预期一致吗？"}
      - {level: 2, outline: "回顾 Array 赋值时复制的是什么，以及 clone() 的作用。"}
      - {level: 3, outline: "在需要保留原数组的地方先 let c = a.clone()，再修改 c。"}
      - {level: 4, outline: "完整解析：b = a 后 b[0] = 9 改变了共享的元素存储，a[0] 也变为 9；c = a.clone() 得到独立副本，c[1] = 7 不影响 a，因此输出 9 2。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "程序输出 9 2 与解释一致（cjc 1.2.0）。"
    source:
      kind: toolchain_experiment
      references: ["exp:array_shared_one_line", "exp:array_assign_shares_buffer", "kb:language.collections.array"]
      toolchain_version: cjc 1.2.0 (cjnative) / cjpm 1.2.0
      verification_status: experiment_verified
    verification:
      method: cjc_minimal_repro
      toolchain_version: cjc 1.2.0 (cjnative)
      expected_outcome: run_ok
      expected_output_contains: "9 2"
      snippet: |
        main() {
            let a: Array<Int64> = [1, 2, 3]
            let b = a
            b[0] = 9
            let c = a.clone()
            c[1] = 7
            println("${a[0]} ${a[1]}")
        }
      note: "赋值共享元素存储，clone 得到独立副本。"

  - id: cj.misconception.let-struct-field-mutation
    topic: class_struct_semantics
    title: "修改 let 绑定的 struct 实例字段"
    root_concept_id: cj.type.let-struct-immutability
    related_concept_ids: [cj.type.struct-value-semantics, cj.basics.let-var-binding]
    trigger_evidence:
      - {kind: compiler_diagnostic, pattern: "cannot assign to immutable value", strength: weak}
      - {kind: code_pattern, pattern: "对 let 绑定的 struct 实例的 var 字段赋值", strength: strong}
    explanation: "let 绑定的 struct 实例整体不可变；字段声明为 var 只表示在可变实例上可改，不能绕过 let 的不可变性。"
    hint_ladder:
      - {level: 1, outline: "报错指向哪个变量？它是用 let 还是 var 声明的？"}
      - {level: 2, outline: "回顾 struct 值语义下 let 绑定对字段修改的限制。"}
      - {level: 3, outline: "把实例绑定改为 var，或构造一个带新字段值的新实例。"}
      - {level: 4, outline: "完整解析：let p = P(1) 使 p 不可变，p.x = 2 被拒绝；改为 var p = P(1) 后即可修改。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "cjc 1.2.0 报 cannot assign to immutable value。"
    source:
      kind: toolchain_experiment
      references: ["exp:struct_let_field_assign", "kb:language.struct"]
      toolchain_version: cjc 1.2.0 (cjnative) / cjpm 1.2.0
      verification_status: experiment_verified
    verification:
      method: cjc_minimal_repro
      toolchain_version: cjc 1.2.0 (cjnative)
      expected_outcome: compile_error
      observed: cannot assign to immutable value
      snippet: |
        struct P { var x: Int64; init(x: Int64) { this.x = x } }
        main() {
            let p = P(1)
            p.x = 2
        }
      note: "该诊断文本与 let 重新赋值、for-in 变量赋值共享，需结合代码模式区分。"

  - id: cj.misconception.struct-method-missing-mut
    topic: class_struct_semantics
    title: "struct 成员函数修改字段却未声明 mut"
    root_concept_id: cj.type.struct-mut-function
    related_concept_ids: [cj.type.struct-value-semantics]
    trigger_evidence:
      - {kind: compiler_diagnostic, pattern: "cannot be modified in immutable function", strength: strong}
    explanation: "struct 的普通成员函数中 this 不可变；需要修改实例成员变量的函数必须声明为 mut func。"
    hint_ladder:
      - {level: 1, outline: "报错的函数在做什么？它是否修改了实例自身的字段？"}
      - {level: 2, outline: "回顾 struct 中 mut 函数的作用与限制。"}
      - {level: 3, outline: "在该成员函数前加 mut，并确认调用方的实例是 var 绑定。"}
      - {level: 4, outline: "完整解析：func inc() { n += 1 } 修改了 n，须写成 mut func inc() { n += 1 }。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "cjc 1.2.0 报 instance member variable 'n' cannot be modified in immutable function。"
    source:
      kind: toolchain_experiment
      references: ["exp:struct_method_without_mut", "kb:language.extend.4-访问规则.4-3-扩展-struct-的-mut-函数"]
      toolchain_version: cjc 1.2.0 (cjnative) / cjpm 1.2.0
      verification_status: experiment_verified
    verification:
      method: cjc_minimal_repro
      toolchain_version: cjc 1.2.0 (cjnative)
      expected_outcome: compile_error
      observed: cannot be modified in immutable function
      snippet: |
        struct Counter {
            var n: Int64 = 0
            func inc() { n += 1 }
        }
        main() {}
      note: "编译期拒绝。"

  - id: cj.misconception.class-inherit-without-open
    topic: class_struct_semantics
    title: "继承未声明 open 的类"
    root_concept_id: cj.type.class-open-inheritance
    trigger_evidence:
      - {kind: compiler_diagnostic, pattern: "is not inheritable", strength: strong}
    explanation: "仓颉中 class 默认不可被继承，父类需要声明为 open（或 abstract）。"
    hint_ladder:
      - {level: 1, outline: "报错指向的是子类还是父类？"}
      - {level: 2, outline: "回顾 class 默认是否可被继承，以及 open 修饰符的作用。"}
      - {level: 3, outline: "在父类声明前加 open，或改用接口组合。"}
      - {level: 4, outline: "完整解析：class A {} 不可继承，改为 open class A {} 后 class B <: A {} 可通过。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "cjc 1.2.0 报 super class 'A' is not inheritable。"
    source:
      kind: toolchain_experiment
      references: ["exp:class_not_open_inherit", "kb:language.class"]
      toolchain_version: cjc 1.2.0 (cjnative) / cjpm 1.2.0
      verification_status: experiment_verified
    verification:
      method: cjc_minimal_repro
      toolchain_version: cjc 1.2.0 (cjnative)
      expected_outcome: compile_error
      observed: is not inheritable
      snippet: |
        class A {}
        class B <: A {}
        main() {}
      note: "编译期拒绝。"

  - id: cj.misconception.override-non-open-member
    topic: class_struct_semantics
    title: "重写未声明 open 的成员函数"
    root_concept_id: cj.type.override-open-member
    related_concept_ids: [cj.type.class-open-inheritance]
    trigger_evidence:
      - {kind: compiler_diagnostic, pattern: "cannot override function", strength: strong}
    explanation: "父类是 open class 并不代表其成员可被重写；只有声明为 open 的成员函数才能被子类 override。"
    hint_ladder:
      - {level: 1, outline: "父类已经是 open 的，为什么仍然不能重写这个函数？"}
      - {level: 2, outline: "回顾类的 open 与成员的 open 是两个独立的声明。"}
      - {level: 3, outline: "在父类的该成员函数前加 open，再在子类中 override。"}
      - {level: 4, outline: "完整解析：open class A { public func f() } 中 f 不是 open，需改为 public open func f()。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "cjc 1.2.0 报 cannot override function 'f'。"
    source:
      kind: toolchain_experiment
      references: ["exp:override_non_open_func", "kb:language.class"]
      toolchain_version: cjc 1.2.0 (cjnative) / cjpm 1.2.0
      verification_status: experiment_verified
    verification:
      method: cjc_minimal_repro
      toolchain_version: cjc 1.2.0 (cjnative)
      expected_outcome: compile_error
      observed: cannot override function
      snippet: |
        open class A { public func f(): Int64 { 1 } }
        class B <: A { public override func f(): Int64 { 2 } }
        main() {}
      note: "编译期拒绝。"

  # ================================================================ 6 enum / match
  - id: cj.misconception.match-non-exhaustive
    topic: enum_match
    title: "match 分支未穷举且没有兜底"
    root_concept_id: cj.pattern-match.exhaustiveness
    related_concept_ids: [cj.pattern-match.match-expression, cj.pattern-match.wildcard]
    trigger_evidence:
      - {kind: compiler_diagnostic, pattern: "non-exhaustive patterns", strength: strong}
    explanation: "match 必须覆盖被匹配值的全部可能；遗漏 enum 构造器又没有 case _ 兜底时，编译器拒绝该 match。"
    hint_ladder:
      - {level: 1, outline: "这个 enum 一共有哪些构造器？你的 match 覆盖了哪些？"}
      - {level: 2, outline: "回顾 match 穷举性要求与通配符 _ 的作用。"}
      - {level: 3, outline: "为遗漏的构造器补充 case，或在最后添加 case _ => 默认值。"}
      - {level: 4, outline: "完整解析：Color 有 Red、Green、Blue，match 缺少 Blue；补 case Blue => 3 或 case _ => 0 即可通过。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "cjc 1.2.0 报 non-exhaustive patterns。"
    source:
      kind: toolchain_experiment
      references: ["exp:match_non_exhaustive", "kb:language.pattern_match.1-match-表达式.1-1-有匹配值的-match"]
      toolchain_version: cjc 1.2.0 (cjnative) / cjpm 1.2.0
      verification_status: experiment_verified
    verification:
      method: cjc_minimal_repro
      toolchain_version: cjc 1.2.0 (cjnative)
      expected_outcome: compile_error
      observed: non-exhaustive patterns
      snippet: |
        enum Color { Red | Green | Blue }
        main() {
            let c = Color.Red
            let n = match (c) {
                case Red => 1
                case Green => 2
            }
            println(n)
        }
      note: "编译期拒绝。"

  - id: cj.misconception.enum-default-equality
    topic: enum_match
    title: "认为枚举默认支持 =="
    root_concept_id: cj.enum.no-default-equality
    related_concept_ids: [cj.pattern-match.match-expression]
    trigger_evidence:
      - {kind: compiler_diagnostic, pattern: "invalid binary operator '==' on type 'Enum-", strength: strong}
    explanation: "自定义 enum 默认没有 == 运算符；比较构造器应使用 match，或在 enum 中定义 operator func ==。"
    hint_ladder:
      - {level: 1, outline: "编译器说哪个运算符不能用于这个类型？"}
      - {level: 2, outline: "回顾自定义 enum 默认提供哪些能力，以及运算符重载。"}
      - {level: 3, outline: "用 match 判断构造器，或在 enum 体内实现 public operator func ==(rhs) 返回 Bool。"}
      - {level: 4, outline: "完整解析：E.A == E.B 无法编译；在 enum E 中用 match ((this, rhs)) 实现 operator func == 后可得到 true/false。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "cjc 1.2.0 报 invalid binary operator '==' on type 'Enum-E'；手动重载后可运行。"
    source:
      kind: toolchain_experiment
      references: ["exp:enum_eq_not_default", "exp:enum_eq_overload_ok"]
      toolchain_version: cjc 1.2.0 (cjnative) / cjpm 1.2.0
      verification_status: experiment_verified
    verification:
      method: cjc_minimal_repro
      toolchain_version: cjc 1.2.0 (cjnative)
      expected_outcome: compile_error
      observed: "invalid binary operator '=='"
      snippet: |
        enum E { A | B }
        main() {
            println(E.A == E.B)
        }
      note: "编译期拒绝；修正版见 exp:enum_eq_overload_ok。"

  # ================================================================ 7 Option / 异常
  - id: cj.misconception.option-as-null
    topic: option_exceptions
    title: "把 Option<T> 当作普通空值直接使用"
    root_concept_id: cj.option.option-type
    related_concept_ids: [cj.option.pattern-unwrap, cj.option.coalescing]
    trigger_evidence:
      - {kind: compiler_diagnostic, pattern: "on type 'Enum-Option<", strength: strong}
      - {kind: code_pattern, pattern: "对 Option<T> 值直接做 T 的运算或调用 T 的成员", strength: strong}
    explanation: "Option<T> 是 Some(T)/None 的 enum，不是“可能为 null 的 T”；使用 T 的运算前必须用 match、?? 等方式先取出值。"
    hint_ladder:
      - {level: 1, outline: "变量 x 的类型到底是 Int64 还是别的类型？"}
      - {level: 2, outline: "回顾 Option<T> 的两个构造器以及取值方式。"}
      - {level: 3, outline: "用 (x ?? 0) + 1，或 match (x) { case Some(v) => v + 1 case None => ... } 处理两种情况。"}
      - {level: 4, outline: "完整解析：x 是 Option<Int64>，不能直接 + 1；写成 let y = (x ?? 0) + 1 并说明 None 时的默认值语义。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "cjc 1.2.0 报 invalid binary operator '+' on type 'Enum-Option<Int64>' and 'Int64'。"
    source:
      kind: toolchain_experiment
      references: ["exp:option_arith_without_unwrap", "kb:std.core.enum.option.value-none"]
      toolchain_version: cjc 1.2.0 (cjnative) / cjpm 1.2.0
      verification_status: experiment_verified
    verification:
      method: cjc_minimal_repro
      toolchain_version: cjc 1.2.0 (cjnative)
      expected_outcome: compile_error
      observed: "invalid binary operator '+'"
      snippet: |
        main() {
            let x: Option<Int64> = None
            let y = x + 1
            println(y)
        }
      note: "编译期拒绝。"

  - id: cj.misconception.none-assigned-to-plain-type
    topic: option_exceptions
    title: "把 None 赋给非 Option 类型"
    root_concept_id: cj.option.option-type
    trigger_evidence:
      - {kind: code_pattern, pattern: "把 None 赋给声明为 String、Int64 等非 Option 类型的变量或返回值", strength: strong}
      - {kind: compiler_diagnostic, pattern: "generic type should be used with type argument", strength: weak}
    explanation: "None 是 Option<T> 的构造器，不是所有类型共享的空值；只有 Option<T> 类型的位置才能放 None。"
    hint_ladder:
      - {level: 1, outline: "变量 s 的声明类型能否表示“没有值”？"}
      - {level: 2, outline: "回顾 None 属于哪个类型，以及仓颉如何表达可缺省的值。"}
      - {level: 3, outline: "把类型改为 Option<String>，并在使用处解构；或提供真实的默认值。"}
      - {level: 4, outline: "完整解析：let s: String = None 无法编译；改为 let s: Option<String> = None，打印时用 s ?? \"\"。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "cjc 1.2.0 编译失败；诊断文本不直接提及 None，诊断时以代码模式为主。"
    source:
      kind: toolchain_experiment
      references: ["exp:option_none_to_plain_type"]
      toolchain_version: cjc 1.2.0 (cjnative) / cjpm 1.2.0
      verification_status: experiment_verified
    verification:
      method: cjc_minimal_repro
      toolchain_version: cjc 1.2.0 (cjnative)
      expected_outcome: compile_error
      observed: generic type should be used with type argument
      snippet: |
        main() {
            let s: String = None
            println(s)
        }
      note: "1.2.0 的诊断文本较间接，属弱触发证据。"

  - id: cj.misconception.getorthrow-none-unchecked
    topic: option_exceptions
    title: "未检查就对 Option 调用 getOrThrow"
    root_concept_id: cj.option.get-or-throw
    related_concept_ids: [cj.option.option-type, cj.exception.try-catch-finally]
    trigger_evidence:
      - {kind: runtime_exception, pattern: "NoneValueException", strength: strong}
    explanation: "getOrThrow() 在值为 None 时抛出 NoneValueException；它不是安全取值方式，应先判断或使用 ??、match。"
    hint_ladder:
      - {level: 1, outline: "程序在哪一行抛出异常？那时变量的值是什么？"}
      - {level: 2, outline: "回顾 getOrThrow 在 None 上的行为。"}
      - {level: 3, outline: "用 match 或 ?? 提供 None 时的处理；确需异常时用 try/catch 捕获。"}
      - {level: 4, outline: "完整解析：x 为 None，x.getOrThrow() 抛 NoneValueException；改为 println(x ?? 0) 或 match 处理。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "cjc 1.2.0 运行期抛出 NoneValueException。"
    source:
      kind: toolchain_experiment
      references: ["exp:option_getOrThrow_none"]
      toolchain_version: cjc 1.2.0 (cjnative) / cjpm 1.2.0
      verification_status: experiment_verified
    verification:
      method: cjc_minimal_repro
      toolchain_version: cjc 1.2.0 (cjnative)
      expected_outcome: runtime_error
      observed: NoneValueException
      snippet: |
        main() {
            let x: Option<Int64> = None
            println(x.getOrThrow())
        }
      note: "运行期失败，退出码非零。"

  # ================================================================ 4 interface / extension
  - id: cj.misconception.direct-extension-implies-interface
    topic: interface_extension
    title: "混淆直接扩展与接口扩展"
    root_concept_id: cj.extend.interface-extension
    related_concept_ids: [cj.extend.direct-extension, cj.interface.declaration]
    trigger_evidence:
      - {kind: code_pattern, pattern: "用 extend T { } 添加与接口同名的函数后，把 T 当作该接口类型使用", strength: strong}
      - {kind: compiler_diagnostic, pattern: "mismatched types", strength: weak}
    explanation: "直接扩展只为类型添加成员，不建立子类型关系；只有 extend T <: I 的接口扩展（或在类型声明处实现接口）才让 T 成为 I 的子类型。"
    hint_ladder:
      - {level: 1, outline: "Sq 已经有 area() 了，为什么仍不能赋给 Shape？"}
      - {level: 2, outline: "回顾直接扩展与接口扩展在子类型关系上的区别。"}
      - {level: 3, outline: "把 extend Sq { ... } 改为 extend Sq <: Shape { ... }。"}
      - {level: 4, outline: "完整解析：仓颉按声明的实现关系判断子类型，而非按方法名匹配；接口扩展后 let sh: Shape = Sq(2) 输出 4。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "cjc 1.2.0 对直接扩展版本报 mismatched types，接口扩展版本输出 4。"
    source:
      kind: toolchain_experiment
      references: ["exp:direct_extension_not_subtype", "exp:interface_extension_ok", "kb:examples.abstractions.direct-extension"]
      toolchain_version: cjc 1.2.0 (cjnative) / cjpm 1.2.0
      verification_status: experiment_verified
    verification:
      method: cjc_minimal_repro
      toolchain_version: cjc 1.2.0 (cjnative)
      expected_outcome: compile_error
      observed: mismatched types
      snippet: |
        interface Shape { func area(): Int64 }
        class Sq {
            public let s: Int64
            init(s: Int64) { this.s = s }
        }
        extend Sq {
            public func area(): Int64 { s * s }
        }
        main() {
            let sh: Shape = Sq(2)
            println(sh.area())
        }
      note: "mismatched types 为通用诊断，需结合代码模式。"

