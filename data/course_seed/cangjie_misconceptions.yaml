      - {level: 2, outline: "回顾仓颉整数溢出的默认处理策略。"}
      - {level: 3, outline: "使用足够宽的类型，或在运算前检查范围。"}
      - {level: 4, outline: "完整解析：inc(127) 中 Int8 的 127 + 1 抛 OverflowException；改用 Int64 或先判断 v < Int8.Max。"}
    review_status: approved
    reviewed_by: wave1-agent-c
    review_note: "cjc 1.2.0 运行期抛 OverflowException: add。"
    source:
