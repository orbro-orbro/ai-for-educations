      - {level: 3, outline: "用目标类型名做显式转换，如 Int64(a)。"}
      - {level: 4, outline: "完整解析：let a: Int32 = 1; let b: Int64 = a 被拒绝；写成 let b: Int64 = Int64(a)。"}
