[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowbound-api"
version = "0.1.0"
description = "KnowBound-CJ API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "PyYAML>=6,<7",
]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests", "../runner/tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
